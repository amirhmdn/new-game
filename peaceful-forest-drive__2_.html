  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

      position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
      font-size: 14px; letter-spacing: 0.04em; opacity: 0.8;
      transition: opacity 1.8s ease; text-align: center; line-height: 1.65;
    }
    #hint.fade { opacity: 0; }
    #speed {
      position: absolute; top: 24px; right: 28px;
      font-size: 13px; opacity: 0.5; letter-spacing: 0.06em;
    }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0a140e; color: #a8c8a8; font-size: 15px; letter-spacing: 0.08em;
      transition: opacity 1.2s ease; z-index: 10;
    }
    #loading.hide { opacity: 0; pointer-events: none; }
  </style>

      if (opts.repeat) t.repeat.set(opts.repeat[0] ?? opts.repeat, opts.repeat[1] ?? opts.repeat);
      t.colorSpace = opts.linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      t.generateMipmaps = true;
      t.minFilter = THREE.LinearMipmapLinearFilter;
      t.magFilter = THREE.LinearFilter;
      return t;
    }

    // Faster decode for data-URI textures via createImageBitmap
    function loadTex(url, opts = {}) {
      return new Promise((resolve) => {
        const finish = (img) => {
          const t = new THREE.Texture(img);
          t.needsUpdate = true;
          resolve(configureTex(t, opts));
        };
        const fail = () => {
          loader.load(
            url,
            (t) => resolve(configureTex(t, opts)),
            undefined,
            () => { console.warn('Texture failed'); resolve(null); }
          );
        };
        if (typeof createImageBitmap === 'function' && typeof url === 'string' && url.startsWith('data:')) {
          fetch(url)
            .then((r) => r.blob())
            .then((b) => createImageBitmap(b))
            .then(finish)
            .catch(fail);
        } else {
          fail();
        }
      });
    }

    function noise2D(x, y) {
      const s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
      return s - Math.floor(s);
    }
    function fbm(x, y, oct = 5) {
      let v = 0, a = 0.5, f = 1;
      for (let i = 0; i < oct; i++) { v += a * noise2D(x * f, y * f); f *= 2; a *= 0.5; }
      return v;
    }
    function createFallback(size, fn, linear = false) {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const ctx = c.getContext('2d');
      const img = ctx.createImageData(size, size);
      const d = img.data;
      for (let y = 0; y < size; y++)
        for (let x = 0; x < size; x++) {
          const i = (y * size + x) * 4;
          const col = fn(x / size, y / size);
          d[i] = col[0]; d[i+1] = col[1]; d[i+2] = col[2]; d[i+3] = 255;
        }
      ctx.putImageData(img, 0, 0);
      const t = new THREE.CanvasTexture(c);
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      t.anisotropy = 4;
      t.colorSpace = linear ? THREE.NoColorSpace : THREE.SRGBColorSpace;
      return t;
    }

    const loadingEl = document.getElementById('loading');

    function createNoiseBuffer(ctx, duration = 5) {
      const len = ctx.sampleRate * duration;

      const data = buffer.getChannelData(0);

    function startAmbience() {
      if (audioCtx) return;

      masterGain.connect(audioCtx.destination);
      const noise = audioCtx.createBufferSource();
      noise.buffer = createNoiseBuffer(audioCtx, 7); noise.loop = true;
      const f1 = audioCtx.createBiquadFilter(); f1.type = 'bandpass'; f1.frequency.value = 220; f1.Q.value = 0.5;
      const f2 = audioCtx.createBiquadFilter(); f2.type = 'lowpass'; f2.frequency.value = 700;
      const windGain = audioCtx.createGain(); windGain.gain.value = 0.28;
      noise.connect(f1); f1.connect(f2); f2.connect(windGain); windGain.connect(masterGain);
      noise.start();
      const lfo = audioCtx.createOscillator(); lfo.type = 'sine'; lfo.frequency.value = 0.06;
      const lfoG = audioCtx.createGain(); lfoG.gain.value = 0.07;
      lfo.connect(lfoG); lfoG.connect(windGain.gain); lfo.start();
      const now = audioCtx.currentTime;

      masterGain.gain.linearRampToValueAtTime(0.65, now + 5);

    function playChirp() {

      const g = audioCtx.createGain();
      const filt = audioCtx.createBiquadFilter(); filt.type = 'bandpass'; filt.frequency.value = base; filt.Q.value = 5;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.028 + Math.random() * 0.02, t + 0.025);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.2 + Math.random() * 0.12);
      osc.frequency.setValueAtTime(base, t);
      osc.frequency.exponentialRampToValueAtTime(base * (0.72 + Math.random() * 0.18), t + 0.22);
      osc.connect(filt); filt.connect(g); g.connect(masterGain);
      osc.start(t); osc.stop(t + 0.4);

    function scheduleBirds() {

    // ── Scene ──

    scene.add(new THREE.HemisphereLight(0x8aab88, 0x2a3a28, 0.5));

    fill.position.set(-45, 22, -35); scene.add(fill);

    // ── Ground height (WORLD-space so terrain doesn't move with the car) ──
    function groundHeight(wx, wz) {
      return Math.sin(wx * 0.02) * 1.4 + Math.cos(wz * 0.017) * 1.15 +
        Math.sin(wx * 0.055 + wz * 0.04) * 0.5 +
        (fbm((wx + 200) * 0.008, (wz + 200) * 0.008, 3) - 0.5) * 1.6;
    }

    // ── Ground (wet jungle floor + mud displacement shader) ──
    const GROUND_SIZE = 520;
    const groundGeo = new THREE.PlaneGeometry(GROUND_SIZE, GROUND_SIZE, 96, 96);
    const gpos = groundGeo.attributes.position;

    function rebuildGroundHeights(gx, gz) {
      // Plane is XY; after rotation.x=-PI/2: localX→worldX, localY→-worldZ, localZ→worldY
      for (let i = 0; i < gpos.count; i++) {
        const lx = gpos.getX(i);
        const ly = gpos.getY(i);
        const wx = gx + lx;
        const wz = gz - ly;
        gpos.setZ(i, groundHeight(wx, wz));
      }
      gpos.needsUpdate = true;
      groundGeo.computeVertexNormals();
    }
    rebuildGroundHeights(0, 0);

    // Mud displacement uniforms (updated each frame from wheel positions)
    const mudUniforms = {
      uWheelPos: { value: [ new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3() ] },
      uWheelStrength: { value: 0.0 },   // scales with speed / weight feel
      uMudRadius: { value: 1.15 },      // sink radius per tire
      uMudDepth: { value: 0.18 },       // max depression (shallow so car stays on top)
      uMudSoft: { value: 0.55 },        // falloff softness
    };

    const groundMat = new THREE.MeshStandardMaterial({
      map: mudDiff,
      normalMap: mudNor,
      normalScale: new THREE.Vector2(1.8, 1.8),
      roughnessMap: mudRough,
      roughness: 1.0,
      metalness: 0.02,
      color: 0xffffff
    });

    // Inject mud displacement into the standard material
    groundMat.onBeforeCompile = (shader) => {
      // Pass uniforms through
      shader.uniforms.uWheelPos = mudUniforms.uWheelPos;
      shader.uniforms.uWheelStrength = mudUniforms.uWheelStrength;
      shader.uniforms.uMudRadius = mudUniforms.uMudRadius;
      shader.uniforms.uMudDepth = mudUniforms.uMudDepth;
      shader.uniforms.uMudSoft = mudUniforms.uMudSoft;

      // Vertex: displace along normal (world up after rotation) under each wheel
      shader.vertexShader = shader.vertexShader.replace(
        '#include <common>',
        `#include <common>
        uniform vec3 uWheelPos[4];
        uniform float uWheelStrength;
        uniform float uMudRadius;
        uniform float uMudDepth;
        uniform float uMudSoft;
        varying float vMudAmount;
        `
      );

      shader.vertexShader = shader.vertexShader.replace(
        '#include <begin_vertex>',
        `#include <begin_vertex>
        {
          // World XZ from model matrix (ground is rotated -90° X, so local xy → world xz)
          vec4 worldPos = modelMatrix * vec4(transformed, 1.0);
          float sink = 0.0;
          for (int i = 0; i < 4; i++) {
            vec2 d = worldPos.xz - uWheelPos[i].xz;
            float dist = length(d);
            float t = clamp(1.0 - dist / max(uMudRadius, 0.001), 0.0, 1.0);
            // smoothstep falloff
            t = t * t * (3.0 - 2.0 * t);
            t = pow(max(t, 0.0), 1.0 + uMudSoft);
            sink += t;
          }
          sink = min(sink, 1.4);
          float disp = sink * uMudDepth * uWheelStrength;
          // PlaneGeometry lies in XY; after rotation.x = -PI/2, local +Z is world up.
          // Depressing local Z pushes the surface downward in world space.
          transformed.z -= disp;
          vMudAmount = clamp(sink * uWheelStrength, 0.0, 1.0);
        }
        `
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <common>',
        `#include <common>
        varying float vMudAmount;
        `
      );

      shader.fragmentShader = shader.fragmentShader.replace(
        '#include <color_fragment>',
        `#include <color_fragment>
        // Compressed mud: darker, wetter look
        float mud = clamp(vMudAmount, 0.0, 1.0);
        diffuseColor.rgb = mix(diffuseColor.rgb, diffuseColor.rgb * vec3(0.55, 0.48, 0.40), mud * 0.65);

      );

        '#include <roughnessmap_fragment>',
        `#include <roughnessmap_fragment>
        // Wet compressed mud is smoother (lower roughness)
        roughnessFactor = mix(roughnessFactor, roughnessFactor * 0.45, clamp(vMudAmount, 0.0, 1.0) * 0.8);
        `
      );

    };

    });

    const glassMat = new THREE.MeshPhysicalMaterial({

    const rubberMat = new THREE.MeshStandardMaterial({

    });

    const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.72, 4.5), bodyMat);
    body.position.y = 1.0; body.castShadow = true; body.receiveShadow = true; car.add(body);
    const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.9, 2.15), bodyMat);
    cabin.position.set(0, 1.72, -0.3); cabin.castShadow = true; car.add(cabin);
    const hood = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.28, 1.35), bodyMat);
    hood.position.set(0, 1.3, 1.6); hood.castShadow = true; car.add(hood);
    const canopy = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.0, 1.75), darkMat);
    canopy.position.set(0, 1.78, -1.55); canopy.castShadow = true; car.add(canopy);

    const winF = new THREE.Mesh(new THREE.BoxGeometry(1.75, 0.58, 0.05), glassMat);
    winF.position.set(0, 1.82, 0.78); car.add(winF);
    const winL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.52, 1.65), glassMat);

    const rack = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.07, 2.9), metalMat);
    rack.position.set(0, 2.3, -0.35); car.add(rack);
    for (let i = -1; i <= 1; i++) {

    for (let i = -1; i <= 1; i++) {

    const bar = new THREE.Mesh(new THREE.BoxGeometry(1.95, 0.38, 0.14), metalMat);
    bar.position.set(0, 0.9, 2.38); car.add(bar);
    const winch = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.13, 0.38, 10), metalMat);
    winch.rotation.z = Math.PI / 2; winch.position.set(0, 0.78, 2.48); car.add(winch);
    const skirt = new THREE.Mesh(new THREE.BoxGeometry(2.25, 0.22, 4.1), mudAccent);
    skirt.position.y = 0.58; car.add(skirt);

    // Wheels with your tire tread normal
    const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.42, 24);
    const wheelPositions = [

    ];
    const wheels = [];
    for (const [x, y, z] of wheelPositions) {

    }

    const cabinLight = new THREE.PointLight(0xb8d0a8, 0.18, 9);
    cabinLight.position.set(0, 1.9, 0); car.add(cabinLight);
    scene.add(car);

    // ── Mud splatter particles ──
    const MUD_MAX = 120;
    const mudPositions = new Float32Array(MUD_MAX * 3);
    const mudColors = new Float32Array(MUD_MAX * 3);
    const mudSizes = new Float32Array(MUD_MAX);
    const mudParticles = []; // { life, maxLife, vx, vy, vz, active }

    for (let i = 0; i < MUD_MAX; i++) {
      mudPositions[i * 3] = 0;
      mudPositions[i * 3 + 1] = -10;
      mudPositions[i * 3 + 2] = 0;

      const shade = 0.35 + Math.random() * 0.45;
      mudColors[i * 3]     = (0.28 + Math.random() * 0.2) * shade;
      mudColors[i * 3 + 1] = (0.18 + Math.random() * 0.12) * shade;
      mudColors[i * 3 + 2] = (0.08 + Math.random() * 0.08) * shade;
      mudSizes[i] = 0.08 + Math.random() * 0.18;

    }

    const mudGeo = new THREE.BufferGeometry();
    mudGeo.setAttribute('position', new THREE.BufferAttribute(mudPositions, 3));
    mudGeo.setAttribute('color', new THREE.BufferAttribute(mudColors, 3));
    mudGeo.setAttribute('size', new THREE.BufferAttribute(mudSizes, 1));

    const mudSpriteMat = new THREE.PointsMaterial({
      size: 0.22,

    });
    const mudPoints = new THREE.Points(mudGeo, mudSpriteMat);

    let mudEmitAcc = 0;
    const _wheelWorld = new THREE.Vector3();
    const _right = new THREE.Vector3();
    const _fwd = new THREE.Vector3();

    function emitMud(dt) {
      const absSpd = Math.abs(speed);
      if (absSpd < 1.2) return;

      // emit rate scales with speed
      mudEmitAcc += dt * (4 + absSpd * 2.2);
      const toEmit = Math.min(4, Math.floor(mudEmitAcc));
      mudEmitAcc -= toEmit;

      _fwd.set(Math.sin(heading), 0, Math.cos(heading));
      _right.set(_fwd.z, 0, -_fwd.x);

      let emitted = 0;
      for (let w = 0; w < 4 && emitted < toEmit; w++) {
        wheels[w].getWorldPosition(_wheelWorld);
        // only rear-ish contact feel: emit from lower side of tire
        const baseY = car.position.y + 0.12;

        for (let n = 0; n < 2 && emitted < toEmit; n++) {
          // find free particle
          let idx = -1;
          for (let i = 0; i < MUD_MAX; i++) {
            if (!mudParticles[i].active) { idx = i; break; }
          }
          if (idx < 0) return;

          const p = mudParticles[idx];
          p.active = true;
          p.maxLife = 0.45 + Math.random() * 0.7;
          p.life = p.maxLife;

          // start near tire bottom, slightly outward
          const side = (w % 2 === 0) ? -1 : 1;
          const ox = (Math.random() - 0.5) * 0.35;
          const oz = (Math.random() - 0.5) * 0.35;
          mudPositions[idx * 3]     = _wheelWorld.x + _right.x * side * 0.15 + ox;
          mudPositions[idx * 3 + 1] = baseY + Math.random() * 0.2;
          mudPositions[idx * 3 + 2] = _wheelWorld.z + _right.z * side * 0.15 + oz;

          // fling outward + backward + up
          const fling = 1.5 + absSpd * 0.35 + Math.random() * 2.2;
          const up = 1.2 + Math.random() * 2.8 + absSpd * 0.15;
          const back = -Math.sign(speed || 1) * (1.0 + Math.random() * 2.5);
          p.vx = _right.x * side * fling + _fwd.x * back + (Math.random() - 0.5) * 1.5;
          p.vy = up;
          p.vz = _right.z * side * fling + _fwd.z * back + (Math.random() - 0.5) * 1.5;

          mudSizes[idx] = 0.06 + Math.random() * 0.2;
          emitted++;
        }
      }
    }

    function updateMud(dt) {
      const posAttr = mudGeo.attributes.position;
      let any = false;
      for (let i = 0; i < MUD_MAX; i++) {
        const p = mudParticles[i];
        if (!p.active) continue;
        any = true;
        p.life -= dt;
        if (p.life <= 0 || mudPositions[i * 3 + 1] < -0.05) {
          p.active = false;
          mudPositions[i * 3 + 1] = -10;
          continue;
        }
        // gravity + drag
        p.vy -= 14 * dt;
        p.vx *= (1 - 1.8 * dt);
        p.vz *= (1 - 1.8 * dt);
        mudPositions[i * 3]     += p.vx * dt;
        mudPositions[i * 3 + 1] += p.vy * dt;
        mudPositions[i * 3 + 2] += p.vz * dt;

        // splash flatten on ground
        const gy = car.position.y;
        if (mudPositions[i * 3 + 1] < gy + 0.05) {
          mudPositions[i * 3 + 1] = gy + 0.04;
          p.vy *= -0.15;
          p.vx *= 0.5;
          p.vz *= 0.5;
          p.life -= dt * 1.5;
        }
      }
      if (any) {
        posAttr.needsUpdate = true;
        mudSpriteMat.opacity = 0.75;
      }
    }

    // ── Tire spray (fine wet mist arcs) ──
    const SPRAY_MAX = 160;
    const sprayPos = new Float32Array(SPRAY_MAX * 3);
    const sprayCol = new Float32Array(SPRAY_MAX * 3);
    const sprayParticles = [];

    for (let i = 0; i < SPRAY_MAX; i++) {
      sprayPos[i * 3 + 1] = -10;
      // wet grey-brown mist
      const s = 0.55 + Math.random() * 0.4;
      sprayCol[i * 3]     = 0.42 * s;
      sprayCol[i * 3 + 1] = 0.38 * s;
      sprayCol[i * 3 + 2] = 0.30 * s;
      sprayParticles.push({ life: 0, maxLife: 1, vx: 0, vy: 0, vz: 0, active: false });
    }

    const sprayGeo = new THREE.BufferGeometry();
    sprayGeo.setAttribute('position', new THREE.BufferAttribute(sprayPos, 3));
    sprayGeo.setAttribute('color', new THREE.BufferAttribute(sprayCol, 3));

    const sprayMat = new THREE.PointsMaterial({
      size: 0.09,
      vertexColors: true,
      transparent: true,
      opacity: 0.55,
      depthWrite: false,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending
    });
    const sprayPoints = new THREE.Points(sprayGeo, sprayMat);
    sprayPoints.frustumCulled = false;
    scene.add(sprayPoints);

    let sprayAcc = 0;

    function emitSpray(dt) {
      const absSpd = Math.abs(speed);
      if (absSpd < 0.8) return;

      // continuous spray volume
      sprayAcc += dt * (10 + absSpd * 5);
      const toEmit = Math.min(8, Math.floor(sprayAcc));
      sprayAcc -= toEmit;

      _fwd.set(Math.sin(heading), 0, Math.cos(heading));
      _right.set(_fwd.z, 0, -_fwd.x);

      let emitted = 0;
      for (let w = 0; w < 4 && emitted < toEmit; w++) {
        wheels[w].getWorldPosition(_wheelWorld);
        const side = (w % 2 === 0) ? -1 : 1;
        // wheel spin direction relative to motion
        const spinDir = Math.sign(speed || 1);

        while (emitted < toEmit) {
          let idx = -1;
          for (let i = 0; i < SPRAY_MAX; i++) {
            if (!sprayParticles[i].active) { idx = i; break; }
          }
          if (idx < 0) return;

          const p = sprayParticles[idx];
          p.active = true;
          p.maxLife = 0.25 + Math.random() * 0.4;
          p.life = p.maxLife;

          // contact patch + slight rearward along tread
          const angle = (Math.random() - 0.35) * 1.1; // spray mostly rearward-up from contact
          const ox = (Math.random() - 0.5) * 0.25;
          const oz = (Math.random() - 0.5) * 0.25;
          sprayPos[idx * 3]     = _wheelWorld.x + _right.x * side * 0.12 + ox;
          sprayPos[idx * 3 + 1] = car.position.y + 0.08 + Math.random() * 0.25;
          sprayPos[idx * 3 + 2] = _wheelWorld.z + _right.z * side * 0.12 + oz;

          // tangential spray: up + back + outward
          const speedFactor = 2.0 + absSpd * 0.55;
          const outward = (0.8 + Math.random() * 2.2) * side;
          const upward = 1.5 + Math.random() * 3.5 + absSpd * 0.2;
          const backward = -spinDir * (2.0 + Math.random() * 4.0 + absSpd * 0.35);

          p.vx = _right.x * outward + _fwd.x * backward + (Math.random() - 0.5) * 1.2;
          p.vy = upward;
          p.vz = _right.z * outward + _fwd.z * backward + (Math.random() - 0.5) * 1.2;

          // brighter wet droplets
          const bright = 0.5 + Math.random() * 0.5;
          sprayCol[idx * 3]     = 0.50 * bright;
          sprayCol[idx * 3 + 1] = 0.45 * bright;
          sprayCol[idx * 3 + 2] = 0.36 * bright;

          emitted++;
          // distribute across wheels
          if (emitted % 3 === 0) break;
        }
      }
    }

    function updateSpray(dt) {
      const posAttr = sprayGeo.attributes.position;
      const colAttr = sprayGeo.attributes.color;
      let any = false;
      for (let i = 0; i < SPRAY_MAX; i++) {
        const p = sprayParticles[i];
        if (!p.active) continue;
        any = true;
        p.life -= dt;
        const lifeT = p.life / p.maxLife;
        if (p.life <= 0 || sprayPos[i * 3 + 1] < -0.1) {
          p.active = false;
          sprayPos[i * 3 + 1] = -10;
          continue;
        }
        p.vy -= 11 * dt;
        p.vx *= (1 - 2.5 * dt);
        p.vz *= (1 - 2.5 * dt);
        sprayPos[i * 3]     += p.vx * dt;
        sprayPos[i * 3 + 1] += p.vy * dt;
        sprayPos[i * 3 + 2] += p.vz * dt;

        const sgy = car.position.y;
        if (sprayPos[i * 3 + 1] < sgy + 0.03) {
          sprayPos[i * 3 + 1] = sgy + 0.03;
          p.vy *= -0.1;
          p.vx *= 0.4;
          p.vz *= 0.4;
          p.life -= dt * 2;
        }

        // fade color with life
        const fade = Math.max(0.15, lifeT);
        sprayCol[i * 3]     *= 0.98; // slight settle each frame, life drives overall
        // store fade via re-scale from base each frame is hard; use size via opacity instead
      }
      if (any) {
        posAttr.needsUpdate = true;
        sprayMat.opacity = 0.5;
        sprayMat.size = 0.08;
      } else {
        sprayMat.opacity = 0.12;
      }
    }

    // ── Trees ──
    const TREE_COUNT = 100;
    const TREE_SPREAD = 150;
    const TREE_MIN = 11;
    const trunkGeo = new THREE.CylinderGeometry(0.4, 0.6, 15.5, 8);
    const trunkMat = new THREE.MeshStandardMaterial({
      map: barkD, normalMap: barkN, normalScale: new THREE.Vector2(1.8, 1.8),
      roughnessMap: barkR, roughness: 1, metalness: 0.02
    });
    const trunks = new THREE.InstancedMesh(trunkGeo, trunkMat, TREE_COUNT);
    trunks.castShadow = true; trunks.receiveShadow = true; scene.add(trunks);

    const canopyGeo = new THREE.SphereGeometry(3.5, 8, 6);
    const canopyMat = new THREE.MeshStandardMaterial({
      map: leafDiff, roughness: 0.8, metalness: 0.0, color: 0xffffff
    });
    const canopies = new THREE.InstancedMesh(canopyGeo, canopyMat, TREE_COUNT);
    canopies.castShadow = false; scene.add(canopies);
    const canopy2Geo = new THREE.SphereGeometry(2.6, 7, 5);
    const canopy2Mat = new THREE.MeshStandardMaterial({
      map: leafDiff, roughness: 0.84, color: 0xc0dcb0
    });
    const canopies2 = new THREE.InstancedMesh(canopy2Geo, canopy2Mat, TREE_COUNT);
    canopies2.castShadow = false; scene.add(canopies2);

    const vineGeo = new THREE.CylinderGeometry(0.035, 0.045, 7, 4);
    const vineMat = new THREE.MeshStandardMaterial({ color: 0x3a6a35, roughness: 0.88 });
    const vines = new THREE.InstancedMesh(vineGeo, vineMat, TREE_COUNT * 2);
    vines.castShadow = false; scene.add(vines);

    const dummy = new THREE.Object3D();
    const treeData = [];
    function randomNear(cx, cz, minR, maxR) {
      const a = Math.random() * Math.PI * 2;
      const r = minR + Math.random() * (maxR - minR);
      return { x: cx + Math.cos(a) * r, z: cz + Math.sin(a) * r };
    }
    function placeTree(i, x, z) {
      const scale = 0.72 + Math.random() * 0.9;
      const rot = Math.random() * Math.PI * 2;
      const gy = groundHeight(x, z);
      treeData[i] = { x, z, scale, rot };
      dummy.position.set(x, gy + 7.7 * scale, z);
      dummy.scale.set(scale * 0.95, scale, scale * 0.95);
      dummy.rotation.set(0, rot, 0); dummy.updateMatrix();
      trunks.setMatrixAt(i, dummy.matrix);
      dummy.position.set(x, gy + 14.5 * scale, z);
      dummy.scale.set(scale * 1.35, scale * 0.95, scale * 1.35); dummy.updateMatrix();
      canopies.setMatrixAt(i, dummy.matrix);
      dummy.position.set(x + (Math.random() - 0.5) * 2.2, gy + 12.8 * scale, z + (Math.random() - 0.5) * 2.2);
      dummy.scale.set(scale * 1.05, scale * 0.85, scale * 1.05); dummy.updateMatrix();
      canopies2.setMatrixAt(i, dummy.matrix);
      for (let v = 0; v < 2; v++) {
        const vi = i * 2 + v;
        dummy.position.set(x + (Math.random() - 0.5) * 2.8 * scale, gy + 10.8 * scale - 3.2, z + (Math.random() - 0.5) * 2.8 * scale);
        dummy.scale.set(1, scale, 1);
        dummy.rotation.set((Math.random() - 0.5) * 0.35, 0, (Math.random() - 0.5) * 0.3);
        dummy.updateMatrix(); vines.setMatrixAt(vi, dummy.matrix);
      }
    }
    for (let i = 0; i < TREE_COUNT; i++) {
      let p, t = 0;
      do { p = randomNear(0, 0, TREE_MIN, TREE_SPREAD); t++; }
      while (Math.hypot(p.x, p.z) < TREE_MIN && t < 30);
      placeTree(i, p.x, p.z);
    }
    trunks.instanceMatrix.needsUpdate = true;
    canopies.instanceMatrix.needsUpdate = true;
    canopies2.instanceMatrix.needsUpdate = true;
    vines.instanceMatrix.needsUpdate = true;

    // ── Plants from your atlas (billboard cross-planes) ──
    const PLANT_COUNT = 60;
    const plantGroup = new THREE.Group();
    scene.add(plantGroup);
    const plantData = [];

    // Atlas UV regions (approximate grid on IMAGE 3)
    // Image is roughly 4 cols x 3 rows of plants
    const atlasRegions = [
      { u: 0.00, v: 0.55, w: 0.28, h: 0.45 }, // large monstera top-left
      { u: 0.28, v: 0.55, w: 0.28, h: 0.45 }, // monstera variegated
      { u: 0.55, v: 0.50, w: 0.22, h: 0.50 }, // palm center
      { u: 0.78, v: 0.55, w: 0.22, h: 0.45 }, // palm fronds right
      { u: 0.00, v: 0.22, w: 0.28, h: 0.32 }, // bush monstera mid
      { u: 0.30, v: 0.22, w: 0.28, h: 0.32 }, // palm white/green
      { u: 0.58, v: 0.22, w: 0.18, h: 0.30 }, // taro / broad leaf
      { u: 0.00, v: 0.00, w: 0.22, h: 0.22 }, // small monstera
      { u: 0.22, v: 0.00, w: 0.18, h: 0.22 }, // ferns bottom
      { u: 0.40, v: 0.00, w: 0.18, h: 0.22 }, // fern cluster
      { u: 0.58, v: 0.00, w: 0.20, h: 0.22 }, // ferns
      { u: 0.78, v: 0.00, w: 0.22, h: 0.50 }, // right ferns / palms
    ];

    function makePlantMaterial(region) {
      if (!plantsAtlas) {
        return new THREE.MeshStandardMaterial({
          map: leafDiff, roughness: 0.75, side: THREE.DoubleSide, transparent: true, alphaTest: 0.3
        });
      }
      const tex = plantsAtlas.clone();
      tex.needsUpdate = true;
      tex.offset.set(region.u, region.v);
      tex.repeat.set(region.w, region.h);
      tex.colorSpace = THREE.SRGBColorSpace;
      return new THREE.MeshStandardMaterial({
        map: tex,
        roughness: 0.78,
        metalness: 0.0,
        side: THREE.DoubleSide,
        transparent: true,
        alphaTest: 0.35,
        depthWrite: true
      });
    }

    const plantMats = atlasRegions.map(makePlantMaterial);
    const plantGeo = new THREE.PlaneGeometry(1.6, 1.8);
    // shift pivot to bottom
    plantGeo.translate(0, 0.9, 0);

    // Pre-create plant pool once (no runtime mesh creation = no lag/jumps)
    const plantPool = [];
    for (let i = 0; i < PLANT_COUNT; i++) {
      const matIdx = i % plantMats.length;
      const g = new THREE.Group();
      g.name = 'p' + i;
      for (let a = 0; a < 2; a++) {
        const mesh = new THREE.Mesh(plantGeo, plantMats[matIdx]);
        mesh.rotation.y = a * Math.PI / 2;
        mesh.castShadow = false; // cheaper
        g.add(mesh);
      }
      plantGroup.add(g);
      plantPool.push(g);
      plantData[i] = { x: 0, z: 0, s: 1, matIdx };
    }

    function placePlant(i, x, z) {
      const s = 0.7 + Math.random() * 1.3;
      plantData[i] = { x, z, s, matIdx: plantData[i].matIdx };
      const g = plantPool[i];
      g.position.set(x, groundHeight(x, z), z);
      g.scale.setScalar(s);
      g.rotation.y = Math.random() * Math.PI * 2;
      g.visible = true;
    }

    for (let i = 0; i < PLANT_COUNT; i++) {
      const p = randomNear(0, 0, 8, TREE_SPREAD * 0.88);
      placePlant(i, p.x, p.z);
    }

    // ── God rays ──
    const rayGroup = new THREE.Group();
    scene.add(rayGroup);
    const rayMat = new THREE.MeshBasicMaterial({
      color: 0xe0f0b8, transparent: true, opacity: 0.032,
      depthWrite: false, side: THREE.DoubleSide, blending: THREE.AdditiveBlending
    });
    for (let i = 0; i < 10; i++) {
      const ray = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 5, 48, 6, 1, true), rayMat.clone());
      ray.position.set((Math.random() - 0.5) * 55, 24, (Math.random() - 0.5) * 55);
      ray.rotation.x = 0.12 + Math.random() * 0.18;
      ray.rotation.z = (Math.random() - 0.5) * 0.22;
      rayGroup.add(ray);
    }

    // Post
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.12, 0.4, 0.92);
    composer.addPass(bloom);
    const fxaa = new ShaderPass(FXAAShader);
    fxaa.material.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
    composer.addPass(fxaa);

    // Input
    const keys = {};
    addEventListener('keydown', e => {
      keys[e.code] = true;
      if (e.code === 'Space') e.preventDefault();
      if (audioCtx?.state === 'suspended') audioCtx.resume();
      startAmbience();
    });
    addEventListener('keyup', e => { keys[e.code] = false; });
    // Alt-tabbing or switching apps never fires keyup for held keys, which would
    // otherwise leave the truck accelerating/turning forever. Clear all input state.
    addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) for (const k in keys) keys[k] = false;
    });

    const controls = new PointerLockControls(camera, document.body);
    renderer.domElement.addEventListener('click', () => {
      startAmbience();
      if (audioCtx?.state === 'suspended') audioCtx.resume();
      if (!controls.isLocked) controls.lock();
    });

    let speed = 0, heading = 0;
    let sinH = 0, cosH = 1; // cached heading trig
    const maxSpeed = 16, invMaxSpeed = 1 / 16;
    const accel = 7, brakeForce = 13, friction = 3.2, turnSpeed = 1.5;
    const maxReverse = maxSpeed * 0.35;
    const camDist = 9, camHeight = 3.8;
    let lookYaw = 0, lookPitch = 0.08;
    const TEX_INV = 10 / 520;
    const spread2 = TREE_SPREAD * TREE_SPREAD;
    const plantSpread = TREE_SPREAD * 0.88;
    const plantSpread2 = plantSpread * plantSpread;

    // Precomputed decay factors use linear approx instead of Math.exp
    // speed *= (1 - k*dt) is cheaper and stable for small dt

    addEventListener('mousemove', e => {
      if (!controls.isLocked) return;
      lookYaw -= e.movementX * 0.002;
      lookPitch -= e.movementY * 0.0015;
      if (lookPitch < -0.28) lookPitch = -0.28;
      else if (lookPitch > 0.48) lookPitch = 0.48;
    });

    const speedEl = document.getElementById('speed');
    const hintEl = document.getElementById('hint');
    setTimeout(() => hintEl.classList.add('fade'), 10000);

    const clock = new THREE.Clock();
    let uiTimer = 0;
    let recycleTimer = 0;
    let lastKmh = -1;

    function recycle(data, placeFn, count, spreadSq, minD) {
      const cx = car.position.x, cz = car.position.z;
      let dirty = false;
      const minD2 = minD * minD;
      for (let i = 0; i < count; i++) {
        const t = data[i];
        const dx = t.x - cx, dz = t.z - cz;
        if (dx * dx + dz * dz > spreadSq) {
          const p = randomNear(cx, cz, TREE_SPREAD * 0.5, TREE_SPREAD * 0.95);
          const pdx = p.x - cx, pdz = p.z - cz;
          if (pdx * pdx + pdz * pdz > minD2) {
            placeFn(i, p.x, p.z);
            dirty = true;
          }
        }
      }
      return dirty;
    }

    function animate() {
      requestAnimationFrame(animate);
      let dt = clock.getDelta();
      if (dt > 0.05) dt = 0.05;

      // ── Input (branch-light) ──
      const throttle = (keys['KeyW'] || keys['ArrowUp']) ? 1
                     : (keys['KeyS'] || keys['ArrowDown']) ? -0.5 : 0;
      const braking = !!keys['Space'];
      const steer = (keys['KeyA'] || keys['ArrowLeft']) ? 1
                  : (keys['KeyD'] || keys['ArrowRight']) ? -1 : 0;

      // ── Physics (no Math.exp) ──
      if (braking) {
        speed -= speed * brakeForce * dt; // linear decay ≈ exp for small dt
      } else if (throttle !== 0) {
        speed += throttle * accel * dt;
      } else {
        speed -= speed * friction * dt;
      }
      if (speed > maxSpeed) speed = maxSpeed;
      else if (speed < -maxReverse) speed = -maxReverse;
      // snap near-zero to stop micro-creep cost
      if (speed < 0.02 && speed > -0.02 && throttle === 0) speed = 0;

      const moving = speed !== 0;
      if (moving && steer !== 0) {
        heading += steer * turnSpeed * (speed * invMaxSpeed) * dt;
        sinH = Math.sin(heading);
        cosH = Math.cos(heading);
      }

      if (moving) {
        const step = speed * dt;
        car.position.x += sinH * step;
        car.position.z += cosH * step;
        car.rotation.y = heading;
      }

      const cx = car.position.x, cz = car.position.z;
      const absSpd = speed < 0 ? -speed : speed;

      // Car rides on world-space terrain (never under the earth)
      car.position.y = groundHeight(cx, cz);

      // Snap ground mesh under car in large steps, rebuild heights in WORLD space
      const gx = Math.round(cx / 40) * 40;
      const gz = Math.round(cz / 40) * 40;
      if (gx !== ground.position.x || gz !== ground.position.z) {
        ground.position.x = gx;
        ground.position.z = gz;
        rebuildGroundHeights(gx, gz);
      }
      // World-locked UVs
      if (mudDiff) {
        const ox = -gx * TEX_INV, oz = gz * TEX_INV;
        mudDiff.offset.x = ox; mudDiff.offset.y = oz;
        if (mudNor) { mudNor.offset.x = ox; mudNor.offset.y = oz; }
        if (mudRough) { mudRough.offset.x = ox; mudRough.offset.y = oz; }
      }

      // Recycle world objects every ~0.25s instead of every frame
      recycleTimer += dt;
      if (recycleTimer > 0.25) {
        recycleTimer = 0;
        if (recycle(treeData, placeTree, TREE_COUNT, spread2, TREE_MIN)) {
          trunks.instanceMatrix.needsUpdate = true;
          canopies.instanceMatrix.needsUpdate = true;
          canopies2.instanceMatrix.needsUpdate = true;
          vines.instanceMatrix.needsUpdate = true;
        }
        recycle(plantData, placePlant, PLANT_COUNT, plantSpread2, 8);
      }

      rayGroup.position.x = cx * 0.25;
      rayGroup.position.z = cz * 0.25;

      if (moving) {
        const spin = speed * dt * 1.85;
        wheels[0].rotation.x += spin;
        wheels[1].rotation.x += spin;
        wheels[2].rotation.x += spin;
        wheels[3].rotation.x += spin;
      }

      // Mud displacement uniforms
      mudUniforms.uWheelStrength.value = 0.35 + (absSpd > 10 ? 0.65 : absSpd * 0.065);
      mudUniforms.uMudRadius.value = 1.05 + (absSpd > 11.25 ? 0.45 : absSpd * 0.04);
      for (let i = 0; i < 4; i++) {
        wheels[i].getWorldPosition(mudUniforms.uWheelPos.value[i]);
        // contact on terrain surface
        mudUniforms.uWheelPos.value[i].y = car.position.y;
      }

      // Particles only when moving enough
      if (absSpd > 0.8) {
        emitMud(dt);
        emitSpray(dt);
      }
      updateMud(dt);
      updateSpray(dt);

      // Camera — reuse cached heading trig when lookYaw ~ 0
      const camAngle = heading + lookYaw;
      const sinC = lookYaw === 0 ? sinH : Math.sin(camAngle);
      const cosC = lookYaw === 0 ? cosH : Math.cos(camAngle);
      const idealX = cx - sinC * camDist;
      const idealZ = cz - cosC * camDist;
      const idealY = car.position.y + camHeight + Math.sin(lookPitch) * 2;
      const lerp = 3.2 * dt;
      camera.position.x += (idealX - camera.position.x) * lerp;
      camera.position.z += (idealZ - camera.position.z) * lerp;
      camera.position.y += (idealY - camera.position.y) * lerp;
      camera.lookAt(cx, car.position.y + 1.5 + lookPitch * 1.3, cz);

      // UI at ~10 Hz
      uiTimer += dt;
      if (uiTimer > 0.1) {
        uiTimer = 0;
        const kmh = (absSpd * 3.6 + 0.5) | 0;
        if (kmh !== lastKmh) {
          lastKmh = kmh;
          speedEl.textContent = kmh + ' km/h';
        }
      }

      composer.render();
    }

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
      bloom.setSize(innerWidth, innerHeight);
      fxaa.material.uniforms['resolution'].value.set(1 / innerWidth, 1 / innerHeight);
    });

    animate();
  </script>
</body>
</html>
